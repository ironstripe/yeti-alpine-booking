# Non-deploying CI: proves the committed bun.lock installs and the frontend builds.
# Never deploys, publishes, uses secrets, runs migrations, or calls backend/test functions.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - name: Versions
        run: |
          node --version
          bun --version
          echo "## Versions" >> "$GITHUB_STEP_SUMMARY"
          echo "node $(node --version), bun $(bun --version)" >> "$GITHUB_STEP_SUMMARY"
      - name: Package source reachability (diagnostic, non-gating)
        run: |
          echo "## Lovable package source reachability" >> "$GITHUB_STEP_SUMMARY"
          for u in $(grep -o 'https://europe-west4-npm.pkg.dev[^"]*\.tgz' bun.lock); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$u" || echo "curl-error")
            echo "$code $u" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Install (frozen lockfile) — hard gate
        run: bun install --frozen-lockfile
      - name: Build — hard gate
        run: bun run build
      - name: Working tree unchanged — hard gate
        run: git diff --exit-code

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true # visible but non-blocking until pre-existing lint debt is cleared
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint (non-blocking, pre-existing debt)
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint.log
      - name: Lint summary
        if: always()
        run: |
          echo "## Lint (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 5 lint.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no lint output" >> "$GITHUB_STEP_SUMMARY"
