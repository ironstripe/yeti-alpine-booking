# Non-deploying CI: proves the committed bun.lock installs and the frontend builds.
# Never deploys, publishes, uses secrets, runs migrations, or calls backend/test functions.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.3
      - name: Versions
        run: |
          node --version
          bun --version
          echo "## Versions" >> "$GITHUB_STEP_SUMMARY"
          echo "node $(node --version), bun $(bun --version)" >> "$GITHUB_STEP_SUMMARY"
      - name: Package source reachability (diagnostic, non-gating)
        run: |
          echo "## Lovable package source reachability" >> "$GITHUB_STEP_SUMMARY"
          for url in $(grep -o 'https://europe-west4-npm.pkg.dev[^"]*\.tgz' bun.lock || true); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 -L "$url") || code="curl-error"
            echo "$code $url" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit 0 # diagnostic never fails the job
      - name: Install (frozen lockfile) — hard gate
        run: bun install --frozen-lockfile
      - name: 26/27 source-tariff PostgreSQL quote contract — hard gate
        run: node tests/bcQuote.integration.mjs
      - name: 26/27 course-period manifest reproducibility — hard gate
        run: |
          python3 scripts/build_bc_2627_course_manifest.py data/bc-2627/source-course-candidates.csv /tmp/bc-2627-course-manifest.csv
          cmp /tmp/bc-2627-course-manifest.csv data/bc-2627/course-manifest-not-active.csv
      - name: 26/27 group age and adult-exception contract — hard gate
        run: node tests/bcAge.integration.mjs
      - name: 26/27 source-specific course levels — hard gate
        run: node tests/bcCourseLevels.integration.mjs
      - name: 26/27 course-draft import and 3210 lesson instances — hard gate
        run: |
          python3 scripts/build_bc_2627_course_import.py data/bc-2627/course-manifest-not-active.csv /tmp/bc-2627-course-import-ci.sql
          cmp /tmp/bc-2627-course-import-ci.sql supabase/migrations/20261002230000_bc_2627_course_drafts.sql
          node tests/bcCourseImport.integration.mjs
      - name: Build — hard gate
        run: bun run build
      - name: Working tree unchanged — hard gate
        run: git diff --exit-code

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint (non-blocking, pre-existing debt)
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          lint_exit=${PIPESTATUS[0]}
          {
            echo "## Lint (non-blocking)"
            echo "lint exit code: $lint_exit"
            tail -n 5 lint.log
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0 # never masks the build result
