name: Gemini Pragmatism Gatekeeper

on:
  pull_request:
    types: [opened, synchronize]

# Modell bewusst gepinnt: ein "latest"-Alias kann von Google jederzeit hinter dem Namen
# ausgetauscht werden; fuer ein Gate ist ein fester Stable-Stand reproduzierbarer.
# Vor dem Update auf ein neues Modell die Liste pruefen: https://ai.google.dev/gemini-api/docs/models
env:
  GEMINI_MODEL: gemini-3.8-flash

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hole PR Diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Gemini Review durchführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, urllib.error

          api_key = os.environ.get('GEMINI_API_KEY')
          pr_num = os.environ.get('PR_NUMBER')
          repo = os.environ.get('REPO')
          gh_token = os.environ.get('GH_TOKEN')
          model = os.environ.get('GEMINI_MODEL', 'gemini-3.8-flash')

          if not api_key:
              raise SystemExit("GEMINI_API_KEY secret fehlt!")

          with open('pr_diff.txt', 'r', encoding='utf-8', errors='ignore') as f:
              diff = f.read()

          # Begrenzung für sehr große PRs
          diff_sample = diff[:50000]

          prompt = f"""
          Du bist der pragmatische Tech-Lead und Gatekeeper. Dein Ziel: Schnelles Shipping (MVP), saubere Architektur, null Overengineering.
          Verhindere das 'Agent Rabbit Hole' (endlose Loops aus Refactoring, Mini-Tests, unnötigen Abstraktionen).

          Analysiere den folgenden Git-Diff dieses Pull Requests:
          ```
          {diff_sample}
          ```

          Antworte nach exakt diesem Schema:
          1. **Verdict**: [SHIP IT 🚀] oder [BLOCK 🛑] (Nur blocken bei echten Showstoppern/Bugs oder extremem Scope Creep!)
          2. **Pragmatismus-Check**: Wurde hier unnötiges Zeug gebaut, das niemand bestellt hat?
          3. **Maximal 2-3 konkrete Bulletpoints**: Was muss zwingend gefixt werden (falls BLOCK), oder was ist die Essenz des PRs (falls SHIP IT).
          Halte dich kurz, direkt und lösungsorientiert.
          """

          # Der API-Key geht als Header mit, nicht in der URL (sonst steht er in Logs und Proxies).
          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
          data = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode('utf-8')

          req = urllib.request.Request(url, data=data, headers={
              'Content-Type': 'application/json',
              'x-goog-api-key': api_key,
          })
          try:
              resp = urllib.request.urlopen(req, timeout=120)
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='ignore')[:800]
              raise SystemExit(f"Gemini API Fehler {e.code} bei Modell '{model}': {body}")

          result = json.loads(resp.read().decode('utf-8'))
          review_comment = result['candidates'][0]['content']['parts'][0]['text']

          comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments"
          comment_data = json.dumps({"body": f"### 🤖 Gemini Pragmatism Review\n\n_Modell: `{model}`_\n\n{review_comment}"}).encode('utf-8')
          req_gh = urllib.request.Request(comment_url, data=comment_data, headers={
              'Authorization': f'Bearer {gh_token}',
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
          })
          urllib.request.urlopen(req_gh, timeout=60)
          EOF
